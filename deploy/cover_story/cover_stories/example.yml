# Example Cover Story — Template for creating custom honeypot identities
#
# Copy this file and customize for your target persona:
#   cp example.yml my_company.yml
#   vim my_company.yml
#
# Then generate assets:
#   python3 generate_cover.py --config cover_stories/my_company.yml --output /tmp/cover_output
#
# All fields under "company" are required. Everything else has sensible defaults.
# Credentials are intentionally fake but realistic-looking — they're honeytokens.

company:
  name: "Acme Corp"                    # Company name for SSL, MOTD, branding
  domain: "acmecorp.io"                # External domain
  hostname: "prod-web-01"              # VM hostname
  city: "Portland"                     # For SSL cert subject
  state: "Oregon"                      # For SSL cert subject
  country: "US"                        # 2-letter country code
  industry: "fintech"                  # Flavor text for branding
  internal_domain: "acme-internal.com" # Fake internal DNS domain
  tagline: "Next-gen payment solutions"
  contact_email: "sre@acmecorp.io"     # Shows up in MOTD / nginx
  team_name: "SRE Team"               # Shows up in MOTD

# SSL cert — auto-generated self-signed cert
ssl:
  cn: "app.acmecorp.io"               # Common Name
  org: "Acme Corp"                     # Organization (usually same as company name)
  days: 365                            # Validity period

# Users — mix of humans, devops, and service accounts for realism.
# Roles: devops, sre, developer, admin, service
# Set crypto_user: true on one dev to get trading bot / wallet decoys.
# SSH keys are auto-generated for human/devops/admin roles.
users:
  - name: akim
    full_name: "Alex Kim"
    role: "devops"
  - name: priya
    full_name: "Priya Patel"
    role: "sre"
  - name: twright
    full_name: "Tyler Wright"
    role: "developer"
    crypto_user: true                  # Gets crypto wallet + trading bot decoys
  - name: deploy
    full_name: "Deploy Bot"
    role: "service"
  - name: jenkins
    full_name: "Jenkins CI"
    role: "service"
  - name: gitlab-runner
    full_name: "GitLab Runner"
    role: "service"
  - name: nagios
    full_name: "Nagios Monitoring"
    role: "service"
  - name: backup
    full_name: "Backup Service"
    role: "service"
  - name: webadmin
    full_name: "Web Administrator"
    role: "admin"
  - name: dbadmin
    full_name: "Database Admin"
    role: "admin"
  - name: appuser
    full_name: "Application Service"
    role: "service"
  - name: devops
    full_name: "DevOps Team"
    role: "devops"
  - name: ftpuser
    full_name: "FTP Upload"
    role: "service"
  - name: redis
    full_name: "Redis Service"
    role: "service"
  - name: mongodb
    full_name: "MongoDB Service"
    role: "service"
  - name: elastic
    full_name: "Elasticsearch"
    role: "service"
  - name: docker
    full_name: "Docker Service"
    role: "service"
  - name: ansible
    full_name: "Ansible Automation"
    role: "devops"
  - name: prometheus
    full_name: "Prometheus Monitoring"
    role: "service"
  - name: www-data
    full_name: "Web Server"
    role: "service"

# Fake internal services / systemd units
services:
  - name: webapp-api
    description: "Production Payment API"
    port: 3000
    user: appuser
    type: node                         # node | python | java | simple | oneshot
    exec: "/usr/bin/node /opt/webapp/server.js"
    after: "network.target mysql.service redis-server.service"
  - name: backup-agent
    description: "Backup Agent — S3 sync"
    type: oneshot
    user: root
    exec: "/root/scripts/backup.sh"
  - name: monitoring-agent
    description: "Prometheus Node Exporter"
    port: 9100
    user: prometheus
    type: simple
    exec: "/usr/local/bin/node_exporter --web.listen-address=:9100"

# Fake internal network — populates /etc/hosts and SSH configs
network:
  internal_hosts:
    - ip: "10.0.1.50"
      names: ["prod-db-01.internal", "db-master"]
    - ip: "10.0.1.51"
      names: ["prod-web-02.internal", "web-02"]
    - ip: "10.0.1.52"
      names: ["redis-01.internal", "cache"]
    - ip: "10.0.1.53"
      names: ["mongo-01.internal", "nosql"]
    - ip: "10.0.1.55"
      names: ["backup-srv.internal", "backups"]
    - ip: "10.0.1.60"
      names: ["staging-db-01.internal", "staging-db"]
    - ip: "10.0.1.100"
      names: ["bastion.acme-internal.com", "bastion"]
    - ip: "10.0.1.200"
      names: ["jenkins.internal", "ci"]
    - ip: "10.0.1.201"
      names: ["gitlab.internal", "git"]


# ============================================================================
# ELKIE SOC — Nginx Reverse Proxy
# ============================================================================
# Ports:
#   3443  → Grafana   (HTTPS + Authelia SSO)
#   5443  → Kibana    (HTTPS + Authelia SSO)
#   9443  → Authelia  (HTTPS frontend)
#   5044  → ES ingest (POST/PUT only — no reads allowed)
#   8080  → Health check endpoint (internal)
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    keepalive_timeout 65;

    # ── Upstream Backends ──────────────────────────────────────────────────
    upstream elasticsearch {
        server elasticsearch:9200;
    }

    upstream kibana {
        server kibana:5601;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream authelia {
        server authelia:9091;
    }

    # ── Health Check (internal, plain HTTP) ────────────────────────────────
    server {
        listen 8080;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Authelia auth-request snippet ──────────────────────────────────────
    # Included by protected upstreams to validate sessions via Authelia.

    # ── Port 9443 — Authelia HTTPS Frontend ────────────────────────────────
    server {
        listen 9443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/elkie.crt;
        ssl_certificate_key /etc/nginx/ssl/elkie.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://authelia;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }

    # ── Port 3443 — Grafana via Authelia SSO ───────────────────────────────
    server {
        listen 3443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/elkie.crt;
        ssl_certificate_key /etc/nginx/ssl/elkie.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Authelia auth subrequest
        location /authelia {
            internal;
            proxy_pass http://authelia/api/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL $scheme://$host:$server_port$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            auth_request /authelia;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $groups $upstream_http_remote_groups;
            auth_request_set $name $upstream_http_remote_name;
            auth_request_set $email $upstream_http_remote_email;

            proxy_set_header Remote-User  $user;
            proxy_set_header Remote-Groups $groups;
            proxy_set_header Remote-Name  $name;
            proxy_set_header Remote-Email $email;

            proxy_pass https://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Redirect to Authelia login on 401
        error_page 401 =302 https://$host:9443/?rd=https://$host:$server_port$request_uri;
    }

    # ── Port 5443 — Kibana via Authelia SSO ────────────────────────────────
    server {
        listen 5443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/elkie.crt;
        ssl_certificate_key /etc/nginx/ssl/elkie.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Authelia auth subrequest
        location /authelia {
            internal;
            proxy_pass http://authelia/api/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL $scheme://$host:$server_port$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            auth_request /authelia;

            proxy_pass http://kibana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Kibana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Redirect to Authelia login on 401
        error_page 401 =302 https://$host:9443/?rd=https://$host:$server_port$request_uri;
    }

    # ── Port 5044 — Elasticsearch Ingest Proxy (POST/PUT only) ─────────────
    # Honeypot subnet Filebeat ships here. Reads are BLOCKED.
    server {
        listen 5044;
        server_name _;

        client_max_body_size 50m;

        # Health check endpoint for Filebeat (GET / must return 200)
        location = / {
            if ($request_method !~ ^(GET|HEAD)$) {
                proxy_pass http://elasticsearch;
                break;
            }
            return 200 '{"status":"ok","name":"elkie-ingest-proxy"}';
            add_header Content-Type application/json;
        }

        # Block all read/admin endpoints
        location ~ ^/(_search|_msearch|_cat|_cluster|_nodes|_tasks|_snapshot|_remote) {
            return 403 '{"error":"read access denied via ingest proxy"}';
            add_header Content-Type application/json;
        }

        # Block GET/DELETE on all other paths (allow POST/PUT only)
        location / {
            limit_except POST PUT {
                deny all;
            }
            proxy_pass http://elasticsearch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

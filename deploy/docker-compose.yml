# ============================================================================
# ELKIE SOC — Docker Compose (ELK-side services)
# ============================================================================
# Usage:
#   cp ../.env.example .env && chmod 600 .env   # fill in values
#   docker compose up -d
# ============================================================================

services:

  # ── Elasticsearch (single-node, no security — internal only) ─────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elkie-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.name=elkie-soc
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELK_IP:-0.0.0.0}:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elkie
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Kibana ───────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: elkie-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=elkie-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "${ELK_IP:-0.0.0.0}:5601:5601"
    networks:
      - elkie
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Grafana (HTTPS, auth.proxy for Authelia SSO) ────────────────────────
  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: elkie-grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/ssl/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/ssl/grafana.key
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_WHITELIST=${ELK_IP:-192.168.50.3}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-changeme}
      - GF_SECURITY_ALLOW_EMBEDDING=true
    ports:
      - "${ELK_IP:-0.0.0.0}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./nginx/ssl:/etc/grafana/ssl:ro
    networks:
      - elkie
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Authelia SSO Gateway ─────────────────────────────────────────────────
  authelia:
    image: authelia/authelia:4.38
    container_name: elkie-authelia
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      - TZ=America/New_York
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - elkie
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9091/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  # 3443  → Grafana  (HTTPS + Authelia auth)
  # 5443  → Kibana   (HTTPS + Authelia auth)
  # 9443  → Authelia (HTTPS frontend)
  # 5044  → ES ingest proxy (POST/PUT only, no reads)
  nginx:
    image: nginx:1.27-alpine
    container_name: elkie-nginx
    restart: unless-stopped
    ports:
      - "${ELK_IP:-0.0.0.0}:3443:3443"
      - "${ELK_IP:-0.0.0.0}:5443:5443"
      - "${ELK_IP:-0.0.0.0}:9443:9443"
      - "${ELK_IP:-0.0.0.0}:5044:5044"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - elkie
    depends_on:
      - elasticsearch
      - kibana
      - grafana
      - authelia
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Sample Analyzer Daemon ───────────────────────────────────────────────
  sample-analyzer:
    image: python:3.12-slim
    container_name: elkie-sample-analyzer
    restart: unless-stopped
    working_dir: /opt/elkie
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install --quiet requests elasticsearch pymisp > /dev/null 2>&1
        python sample_analyzer.py
    env_file:
      - .env
    environment:
      - ES_URL=http://elasticsearch:9200
      - ELKIE_HOME=/opt/elkie
      - STAGING_DIR=/opt/elkie/sample_staging
      - REPORTS_DIR=/opt/elkie/reports
      - STATE_FILE=/opt/elkie/.sample_analyzer_state.json
      - LOG_FILE=/opt/elkie/sample_analyzer.log
    volumes:
      - ${ELKIE_HOME:-/home/legs}:/opt/elkie
      - ${ELKIE_HOME:-/home/legs}/.ssh:/root/.ssh:ro
    networks:
      - elkie
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sample_analyzer.py || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  es_data:
    driver: local
  grafana_data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  elkie:
    driver: bridge
    name: elkie

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cisco Lab — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Animated background grid */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        linear-gradient(rgba(15,52,96,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,52,96,0.3) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 20s linear infinite;
    z-index: 0;
}
@keyframes gridScroll {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
}

.login-container {
    position: relative;
    z-index: 1;
    width: 400px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.login-header {
    text-align: center;
    margin-bottom: 32px;
}
.login-header h1 {
    color: #e94560;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 4px;
}
.login-header p {
    color: #7f8c8d;
    font-size: 13px;
}

.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    color: #bdc3c7;
    font-size: 12px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.form-group input {
    width: 100%;
    padding: 12px 16px;
    background: #1a1a2e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    color: #ecf0f1;
    font-size: 15px;
    font-family: monospace;
    outline: none;
    transition: border-color 0.2s;
}
.form-group input:focus {
    border-color: #e94560;
}
.form-group input::placeholder {
    color: #4a4a6a;
}

.login-btn {
    width: 100%;
    padding: 12px;
    background: #e94560;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 1px;
}
.login-btn:hover { background: #c0392b; }
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; }

.error-msg {
    background: rgba(231,76,60,0.15);
    border: 1px solid #e74c3c;
    color: #e74c3c;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    animation: shake 0.3s;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.lockout-msg {
    background: rgba(243,156,18,0.15);
    border: 1px solid #f39c12;
    color: #f39c12;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    text-align: center;
}

.footer {
    text-align: center;
    margin-top: 24px;
    color: #4a4a6a;
    font-size: 11px;
}

/* Password change modal */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
    background: #16213e;
    border: 1px solid #e94560;
    border-radius: 12px;
    padding: 32px;
    width: 400px;
}
.modal h2 { color: #e94560; margin-bottom: 8px; font-size: 18px; }
.modal p { color: #7f8c8d; font-size: 12px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1>CISCO LAB</h1>
        <p>Network Training Environment</p>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="lockout-msg" id="lockout-msg"></div>

    <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="login-btn">AUTHENTICATE</button>
    </form>

    <div class="footer">
        Unauthorized access is prohibited. All activity is logged.
    </div>
</div>

<!-- Password change modal -->
<div class="modal-overlay" id="pw-modal">
    <div class="modal">
        <h2>Change Password Required</h2>
        <p>You must change your password before continuing.</p>
        <div class="error-msg" id="pw-error" style="display:none"></div>
        <form onsubmit="doChangePassword(event)">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="pw-current" required>
            </div>
            <div class="form-group">
                <label>New Password (min 8 characters)</label>
                <input type="password" id="pw-new" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="pw-confirm" minlength="8" required>
            </div>
            <button type="submit" class="login-btn">CHANGE PASSWORD</button>
        </form>
    </div>
</div>

<script>
let csrfToken = '';

// Get CSRF token on load
fetch('/api/auth/status')
    .then(r => r.json())
    .then(d => {
        csrfToken = d.csrf;
        if (d.authenticated) window.location.href = '/';
    });

function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');
    const lockEl = document.getElementById('lockout-msg');
    errEl.style.display = 'none';
    lockEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'AUTHENTICATING...';

    fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken,
        },
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
        }),
    })
    .then(r => r.json().then(d => ({status: r.status, data: d})))
    .then(({status, data}) => {
        btn.disabled = false;
        btn.textContent = 'AUTHENTICATE';

        if (data.ok) {
            if (data.must_change) {
                document.getElementById('pw-modal').classList.add('show');
                document.getElementById('pw-current').value = document.getElementById('password').value;
            } else {
                window.location.href = '/';
            }
        } else if (status === 429) {
            lockEl.textContent = data.error;
            lockEl.style.display = 'block';
        } else {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.textContent = 'AUTHENTICATE';
        errEl.textContent = 'Connection error.';
        errEl.style.display = 'block';
    });
}

function doChangePassword(e) {
    e.preventDefault();
    const pwErr = document.getElementById('pw-error');
    pwErr.style.display = 'none';

    const newPw = document.getElementById('pw-new').value;
    const confirm = document.getElementById('pw-confirm').value;

    if (newPw !== confirm) {
        pwErr.textContent = 'Passwords do not match.';
        pwErr.style.display = 'block';
        return;
    }

    // Refresh CSRF after login
    fetch('/api/auth/status')
        .then(r => r.json())
        .then(d => {
            csrfToken = d.csrf;
            return fetch('/api/auth/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken,
                },
                body: JSON.stringify({
                    current: document.getElementById('pw-current').value,
                    new_password: newPw,
                }),
            });
        })
        .then(r => r.json())
        .then(d => {
            if (d.ok) {
                window.location.href = '/';
            } else {
                pwErr.textContent = d.error;
                pwErr.style.display = 'block';
            }
        });
}
</script>
</body>
</html>

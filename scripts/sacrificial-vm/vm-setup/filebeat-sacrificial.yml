filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml

filebeat.modules:
  - module: auditd
    log:
      enabled: true

filebeat.inputs:
  - type: filestream
    id: auth
    enabled: true
    paths:
      - /var/log/auth.log
    fields:
      log_type: auth
      honeypot_type: sacrificial-vm
    fields_under_root: false

  - type: filestream
    id: cpu-reaper
    enabled: true
    paths:
      - /var/log/cpu-reaper.json
    parsers:
      - ndjson:
          keys_under_root: true
          overwrite_keys: true
    fields:
      log_type: cpu-reaper
      honeypot_type: sacrificial-vm
    fields_under_root: false

# The auditd module parses audit.log and produces structured fields:
#   event.action: "execve", process.args, process.executable, etc.
# The custom pipeline is optional for enrichment (threat scoring).

output.elasticsearch:
  hosts: ["192.168.50.3:9200"]
  index: "sacrificial-vm-%{+yyyy.MM.dd}"
  pipeline: "honeypot-sacrificial"

setup.template.enabled: false
setup.ilm.enabled: false

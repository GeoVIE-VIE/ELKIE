filebeat.inputs:
  - type: filestream
    id: auditd
    enabled: true
    paths:
      - /var/log/audit/audit.log
    fields:
      log_type: auditd
      honeypot_type: sacrificial-vm
    fields_under_root: false
    parsers:
      - multiline:
          pattern: '^type='
          negate: true
          match: after

  - type: filestream
    id: auth
    enabled: true
    paths:
      - /var/log/auth.log
    fields:
      log_type: auth
      honeypot_type: sacrificial-vm
    fields_under_root: false

  - type: filestream
    id: cpu-reaper
    enabled: true
    paths:
      - /var/log/cpu-reaper.json
    parsers:
      - ndjson:
          keys_under_root: true
          overwrite_keys: true
    fields:
      log_type: cpu-reaper
      honeypot_type: sacrificial-vm
    fields_under_root: false

# NOTE: The VM currently uses the Filebeat auditd module instead of
# this filestream config. The auditd module sets service.type=auditd
# and event.module=auditd (not fields.log_type). The ingest pipeline
# in elasticsearch-pipeline.json checks service.type accordingly.

output.elasticsearch:
  hosts: ["192.168.50.3:9200"]
  index: "sacrificial-vm-%{+yyyy.MM.dd}"
  pipeline: "honeypot-sacrificial"

setup.ilm.enabled: false

#
# auditd.conf - Auditd configuration for sacrificial honeypot VM
#
# Optimized for:
#   - High-volume logging on honeypot VMs
#   - Surviving snapshot reverts without going silent
#   - Shipping logs to Elasticsearch at 192.168.40.99
#
# Deploy to: /etc/audit/auditd.conf
#

# Log file location
log_file = /var/log/audit/audit.log
log_group = root
log_format = RAW

# RAW format avoids the UID->username enrichment bottleneck that causes
# backpressure under load. Filebeat/Elasticsearch can enrich later.
# ENRICHED format resolves on every event and is the #1 cause of auditd
# silently stalling after a snapshot revert when the backlog floods.

# Write behavior - flush frequently so events aren't lost on crash/revert
write_logs = yes
flush = INCREMENTAL_ASYNC
freq = 50

# Log rotation - 100MB x 10 files = 1GB max disk usage
max_log_file = 100
num_logs = 10
max_log_file_action = ROTATE

# Priority boost for the auditd daemon (higher = more priority)
priority_boost = 4

# Name resolution - don't resolve (avoids DNS hangs after snapshot revert)
name_format = HOSTNAME
name = sacrificial-vm

# Dispatcher - audisp plugin handler
disp_qos = lossy
dispatcher = /sbin/audispd

# Space handling - never suspend or halt, just warn
space_left = 75
space_left_action = SYSLOG
action_mail_acct = root
admin_space_left = 50
admin_space_left_action = SYSLOG
disk_full_action = SUSPEND
disk_error_action = SYSLOG

# TCP listener - disabled (we use Filebeat to ship logs)
tcp_listen_port = 0
tcp_listen_queue = 5
tcp_max_per_addr = 1
tcp_client_ports = 1024-65535
tcp_client_max_idle = 0

# Kerberos - disabled
enable_krb5 = no
krb5_principal = auditd

# Distribution - disabled (single node)
distribute_network = no

# End of file
